<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playoff Picture 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: sideline clipboard - a scoreboard strip on top, a tab rail, one working panel below */
:root {
  --bg: #f2f4ef; --surface: #ffffff; --ink: #17221b; --muted: #5b6a60; --line: #d6ddd3;
  --board: #173f2a; --board-ink: #f2f4ef; --turf: #1f5c3a; --turf-soft: #e2ede5;
  --pylon: #d85f16; --pylon-soft: #fbe7da; --win: #1d7342; --loss: #a83a2e; --logo-bg: transparent;
  --display: 'Graduate', 'Rockwell', Georgia, serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --data: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1511; --surface: #152019; --ink: #e5ebe6; --muted: #93a398; --line: #2a3a30;
  --board: #10291b; --board-ink: #e5ebe6; --turf: #63c08a; --turf-soft: #1b3325;
  --pylon: #f08b47; --pylon-soft: #3a2416; --win: #63c08a; --loss: #e57b6e; --logo-bg: #e8ede8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1511; --surface: #152019; --ink: #e5ebe6; --muted: #93a398; --line: #2a3a30;
  --board: #10291b; --board-ink: #e5ebe6; --turf: #63c08a; --turf-soft: #1b3325;
  --pylon: #f08b47; --pylon-soft: #3a2416; --win: #63c08a; --loss: #e57b6e; --logo-bg: #e8ede8; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--pylon); outline-offset: 2px; }
.num, td.n { font-family: var(--data); font-variant-numeric: tabular-nums; }

/* scoreboard strip, with chalk yard lines */
.board { background: var(--board); color: var(--board-ink);
  background-image: repeating-linear-gradient(90deg, transparent 0 79px, rgba(255,255,255,.06) 79px 81px); }
.board .wrap { padding-block: 22px 18px; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: end; justify-content: space-between; }
.board h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4.5vw, 40px); line-height: 1.05; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.board .sub { margin: 6px 0 0; font-size: 14px; opacity: .8; }
.tally { display: flex; gap: 22px; font-family: var(--data); }
.tally div { display: grid; }
.tally b { font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.tally span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }

/* tab rail + action row */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.rail .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 13px 12px 11px; font-family: var(--data); font-weight: 600; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pylon); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 16px 4px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn:hover { border-color: var(--turf); }
.btn.primary { background: var(--turf); border-color: var(--turf); color: var(--bg); }
.btn:disabled { opacity: .45; cursor: default; border-color: var(--line); }
.hint { color: var(--muted); font-size: 13px; }
main { padding-block: 10px 60px; }
h2 { font-family: var(--data); font-size: 22px; font-weight: 700; letter-spacing: .02em; margin: 8px 0 4px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 16px; max-width: 68ch; }

/* team chip */
.chip { display: inline-grid; place-items: center; min-width: 46px; height: 24px; padding: 0 5px; border-radius: 4px; background: var(--c); color: var(--ct); font-family: var(--data); font-weight: 700; font-size: 13px; letter-spacing: .03em; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); flex: none; }
.chip.fcs { background: var(--line); color: var(--muted); }
.chip img { display: none; width: 24px; height: 24px; object-fit: contain; }
.chip.logo { background: var(--logo-bg); box-shadow: none; }
.chip.logo img { display: block; }
.chip.logo .ab { display: none; }
.champ .chip.logo, .sheet-head .chip.logo { background: var(--board-ink); }
.rk { font-family: var(--data); font-size: 12px; color: var(--muted); font-weight: 600; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.weeks { display: flex; gap: 4px; overflow-x: auto; max-width: 100%; padding-bottom: 2px; }
.wk { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 4px 9px; font-family: var(--data); font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.wk.done { color: var(--muted); }
.wk[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
select, input[type="search"] { font: inherit; font-size: 14px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }

/* game rows */
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 10px; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 10px; display: grid; gap: 6px; min-width: 0; }
.gmeta { display: flex; gap: 8px; font-size: 12px; color: var(--muted); font-family: var(--data); letter-spacing: .03em; text-transform: uppercase; }
.gmeta .tag { color: var(--turf); font-weight: 700; }
.side { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 5px 7px; cursor: pointer; min-width: 0; }
.side .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.side .nm small { font-weight: 500; color: var(--muted); margin-left: 6px; font-family: var(--data); font-size: 13px; }
.side .v { font-family: var(--data); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.side .p { font-family: var(--data); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side:hover:not(:disabled) { border-color: var(--line); }
.side.proj { background: var(--turf-soft); }
.side.picked { background: var(--turf-soft); border-color: var(--turf); box-shadow: inset 3px 0 0 var(--turf); }
.side.picked .p { color: var(--turf); font-weight: 700; }
.side:disabled { cursor: default; }
.side.picked.sim { border-style: dashed; box-shadow: none; }
.legend i.pk.sm { border-style: dashed; box-shadow: none; }
/* simulator */
.sim-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile b { display: block; font-family: var(--data); font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 13px; color: var(--muted); }
.ups { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.ups li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.ups .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ups .odds { font-family: var(--data); font-weight: 700; color: var(--pylon); font-variant-numeric: tabular-nums; }
.dice td.n b { font-size: 16px; }
.side .imp { grid-column: 2 / -1; margin-top: -5px; font-family: var(--data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side .imp b { color: var(--ink); font-weight: 600; }
/* big games */
.imp-head { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
.imp-head .now { font-family: var(--data); font-size: 15px; }
.imp-head .now b { font-size: 22px; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 11px; font-weight: 600; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.imp-list { display: grid; gap: 10px; }
.root { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 8px; }
.root li { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.root .who { flex: 1; min-width: 0; }
.root .who .hint b { color: var(--ink); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.on { background: var(--pylon); color: #fff; border-color: var(--pylon); }
h2 .chip { vertical-align: middle; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.imp-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 300px); gap: 12px; align-items: center; }
.imp-row .n { font-family: var(--data); font-weight: 700; color: var(--muted); text-align: right; font-size: 15px; }
.imp-row .game { margin: 0; }
.swing { display: grid; gap: 4px; font-family: var(--data); font-size: 14px; font-variant-numeric: tabular-nums; }
.swing .out { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.swing .out span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.swing .out b { font-size: 16px; }
.swing .out b small { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.swing .out.up b { color: var(--win); }
.swing .out.down b { color: var(--loss); }
.swing .delta { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--pylon); font-weight: 700; }
.own { box-shadow: inset 3px 0 0 var(--pylon); }
@media (max-width: 640px) { .imp-row { grid-template-columns: 22px minmax(0, 1fr); } .imp-row .swing { grid-column: 2; } }
.side.lost { opacity: .55; }
.side.won .v { color: var(--win); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; background: var(--turf-soft); }
.legend i.pk { border: 1px solid var(--turf); box-shadow: inset 3px 0 0 var(--turf); }

/* standings */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 12px 8px; min-width: 0; }
.card h3 { margin: 0 0 6px; font-family: var(--data); font-size: 18px; letter-spacing: .02em; display: flex; justify-content: space-between; gap: 8px; }
.card h4 { margin: 8px 0 2px; font-family: var(--data); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
table { border-collapse: collapse; width: 100%; }
th { font-family: var(--data); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th.n, td.n { text-align: right; }
td.n { font-size: 15px; }
.tm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tm span.nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
tr.ccg td:first-child { box-shadow: inset 3px 0 0 var(--pylon); }
.pill { display: inline-block; font-family: var(--data); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; background: var(--pylon-soft); color: var(--pylon); white-space: nowrap; }
.pill.g { background: var(--turf-soft); color: var(--turf); }
.scroll { overflow-x: auto; }
.tmb { display: block; width: 100%; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; min-width: 0; }
.tmb:hover .nm { text-decoration: underline; text-underline-offset: 3px; }
.ties { margin: 8px 0 4px; padding-left: 18px; font-size: 13px; color: var(--muted); display: grid; gap: 3px; }
.ties b { color: var(--ink); font-family: var(--data); letter-spacing: .02em; }
.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; max-width: 80ch; }
.rules summary { cursor: pointer; font-weight: 700; }
.rules ol { display: grid; gap: 5px; padding-left: 22px; }
.rules p { margin: 8px 0; }
.tb { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 13px; }
.tb summary { cursor: pointer; font-weight: 700; font-size: 14px; }
.tb h5 { margin: 10px 0 4px; font-family: var(--data); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tb ol { display: grid; gap: 4px; padding-left: 20px; margin: 0; }
.tb p { margin: 8px 0 0; }
.tb a { color: inherit; text-underline-offset: 2px; }
/* team schedule sheet */
dialog.sheet { width: min(820px, calc(100vw - 32px)); max-height: 88vh; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
dialog.sheet::backdrop { background: rgba(10, 20, 14, .55); }
.sheet-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--board); color: var(--board-ink); }
.sheet-head .t { font-family: var(--display); font-size: clamp(18px, 3vw, 24px); line-height: 1.1; }
.sheet-head .k { font-family: var(--data); font-size: 13px; letter-spacing: .05em; opacity: .85; }
.sheet-head .x { margin-left: auto; background: none; border: 1px solid rgba(255,255,255,.35); color: var(--board-ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-weight: 600; }
.sheet-body { padding: 14px 16px 18px; display: grid; gap: 12px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 18px; font-family: var(--data); font-size: 15px; }
.facts span { color: var(--muted); }
.facts b { font-variant-numeric: tabular-nums; }
.sheet .games { grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }

/* title games */
.tg { display: grid; gap: 6px; }
.tg .side { border-color: var(--line); }

/* rankings */
.weigh { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
.weigh input { width: min(260px, 60vw); accent-color: var(--pylon); }
.weigh label { font-weight: 600; }
.cut td { border-top: 2px dashed var(--pylon); }
.seg.asof { flex-wrap: wrap; }
td.espn small { font-size: 11px; color: var(--muted); margin-left: 3px; }
td.espn small.off { color: var(--pylon); font-weight: 700; }
/* the Oracle */
.oracle { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin: 4px 0 16px; max-width: 760px; }
@media (max-width: 520px) { .oracle { grid-template-columns: 1fr; justify-items: center; text-align: center; } .oracle .stops { justify-content: center; } }
.orb { width: 150px; height: auto; display: block; }
.orb .stand { fill: var(--ink); opacity: .85; }
.orb .ball { stroke: var(--orb); stroke-width: 1.5; }
.orb .sw { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; opacity: .55; }
.orb .sw.thin { stroke-width: 2; opacity: .4; }
.orb .swirl { transform-origin: 70px 64px; animation: orbspin linear infinite; }
.orb .ln { fill: none; stroke: #1d2a22; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.orb .ln.fill { fill: #1d2a22; }
.orb .ey { fill: #1d2a22; }
.orb .shine { fill: #fff; opacity: .7; }
.orb .spark { fill: var(--orb); animation: twinkle 1.6s ease-in-out infinite; }
@keyframes orbspin { to { transform: rotate(360deg); } }
@keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .orb .swirl, .orb .spark { animation: none; } }
.oracle .k { font-family: var(--data); text-transform: uppercase; letter-spacing: .1em; font-size: 12px; color: var(--muted); }
.oracle .t { font-family: var(--display); font-size: clamp(22px, 3.4vw, 30px); line-height: 1.1; color: var(--orb); }
.oracle p { margin: 6px 0; }
.oracle input[type="range"] { width: 100%; max-width: 420px; accent-color: var(--orb); margin: 6px 0 2px; }
.oracle .stops { display: flex; flex-wrap: wrap; gap: 4px; }
.oracle .stops button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
.oracle .stops button[aria-pressed="true"] { background: var(--orb); border-color: var(--orb); color: #fff; }
.chart { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 10px 8px; max-width: 760px; }
.chart svg { width: 100%; height: auto; display: block; font-family: var(--data); }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 12px; }
.chart .ol { fill: none; stroke: var(--turf); stroke-width: 2.5; stroke-linejoin: round; }
.chart .el { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart .pt { fill: var(--turf); stroke: var(--surface); stroke-width: 1.5; }
.chart .ept { fill: var(--muted); }
.chart .gm rect { fill: var(--turf-soft); }
.chart .gm.l rect { fill: var(--pylon-soft); }
.chart .gm text { font-size: 11px; font-weight: 700; fill: var(--win); }
.chart .gm.l text { fill: var(--loss); }
.chart figcaption { font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 4px; }
.chart .k { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid var(--turf); vertical-align: middle; margin-right: 4px; }
.chart .k.el { border-top: 1.5px dashed var(--muted); }
.path { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--pylon); border-radius: 8px; padding: 4px 14px; max-width: 80ch; }
.path p { margin: 10px 0; }
.path.gap { border-left-color: var(--turf); margin-bottom: 12px; }
/* conference grid */
.mx-confs { flex-wrap: wrap; }
.mx-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: 16px; align-items: start; }
@media (max-width: 980px) { .mx-wrap { grid-template-columns: minmax(0, 1fr); } }
table.mx { width: auto; border-collapse: separate; border-spacing: 3px; }
.mx th, .mx td { padding: 0; border: 0; }
.mx thead th { text-align: center; vertical-align: bottom; padding-bottom: 2px; }
.mx thead .chip { min-width: 44px; }
.mx .rowh { position: sticky; left: 0; z-index: 1; background: var(--bg); padding: 0 8px 0 4px; white-space: nowrap; font-weight: 500; max-width: 190px; }
.mx .rowh.ccg { box-shadow: inset 3px 0 0 var(--pylon); }
.mx tr.div-start th, .mx tr.div-start td { border-top: 2px solid var(--line); }
.mx td.c { width: 48px; height: 40px; text-align: center; border-radius: 5px; font-family: var(--data); line-height: 1.05; font-variant-numeric: tabular-nums; }
.mx td.c b { display: block; font-size: 15px; }
.mx td.c small { font-size: 11px; color: var(--muted); }
.mx .mx-self { background: var(--line); }
.mx .mx-none { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--line) 5px 6px); opacity: .5; }
.mx .fin.w { background: var(--turf-soft); color: var(--win); }
.mx .fin.l { background: var(--surface); color: var(--loss); }
.mx .tot { padding: 0 6px; font-family: var(--data); font-size: 15px; white-space: nowrap; }
.mx-btn { width: 100%; height: 40px; display: grid; place-content: center; gap: 1px; padding: 0; border: 1px dashed var(--line); border-radius: 5px; background: var(--surface); cursor: pointer; font-family: var(--data); line-height: 1.05; }
.mx-btn b { font-size: 15px; }
.mx-btn small { font-size: 11px; color: var(--muted); }
.mx-btn:hover { border-color: var(--turf); }

<script src="data/season.js?v=3"></script>

<script>
// A browser can hold an older cached copy of the data file that lacks fields this page needs; fetch a fresh one.
if (!window.CFB_DATA || !window.CFB_DATA.polls) document.write('<script src="data/season.js?t=' + Date.now() + '"><\/script>');
</script>
<script>
const D = window.CFB_DATA;
const T = Object.fromEntries(D.teams.map(t => [t.id, t]));
const CONF = Object.fromEntries(D.conferences.map(c => [c.id, c]));
const IND = '18';
const FBS = D.teams.map(t => t.id);
const GAMES = D.games;
const G = Object.fromEntries(GAMES.map(g => [g.id, g]));
const SD = 14, H2H_GAP = 0.5; // ranking-score units; roughly ten spots near the top
// Committee model settings, in ranking-score units: the cost of each loss (lossW), an extra cost for every loss
// after the first (loss2W), and the conference champion's bonus (champB). Together with the default 15% power
// weight, these were fit on Oct 21, 2026 so the simulated playoff odds match ESPN's FPI playoff odds as closely as
// possible (average gap 2.4 points per contender, from 3.5) using FPI game odds. A heavier second-loss cost made
// the match worse, so it stays at 0. lossCost is what each team's losses cost it.
const CM = { lossW: 0.1, loss2W: 0, champB: 0.1 };
const DEFAULT_W = 15, MODEL_VERSION = 2;
const lossCost = l => CM.lossW * l + CM.loss2W * Math.max(0, l - 1);
const STORE = 'cfb-playoff-picture-2026';

// ---------- state ----------
let S = { picks: {}, ccg: {}, cfp: {}, w: DEFAULT_W, tab: 'picks', week: null, conf: '', q: '', src: 'blend', h2h: true };
try { Object.assign(S, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) {}
// A saved power weight from before the retune goes to the new default
if (S.model !== MODEL_VERSION) { S.w = DEFAULT_W; S.model = MODEL_VERSION; }
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }

// ---------- math ----------
function erf(x) { const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x);
  return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x)); }
const Phi = x => 0.5 * (1 + erf(x / Math.SQRT2));
const mean = v => v.reduce((a, b) => a + b, 0) / v.length;
const sdev = v => { const m = mean(v); return Math.sqrt(mean(v.map(x => (x - m) ** 2))); };

// Ratings: ESPN FPI and Sagarin PREDICTOR, both as points better than an average FBS team on a neutral field.
// Sagarin also rates FCS teams; FPI doesn't, so FCS opponents get FPI-equivalents scaled from Sagarin.
const RT = D.ratings;
const sagFBS = FBS.map(i => T[i].sag), fpiFBS = FBS.map(i => T[i].fpi);
const SAG_MEAN = mean(sagFBS), SAG_TO_FPI = sdev(fpiFBS) / sdev(sagFBS);
const fcsSags = GAMES.filter(g => g.fcsSag != null).map(g => g.fcsSag).sort((a, b) => a - b);
const FCS_SAG = fcsSags.length ? fcsSags[fcsSags.length >> 1] : SAG_MEAN - 30;
const SOURCES = {
  blend: { label: 'FPI + Sagarin blend', hfa: (RT.fpiHfa + RT.sagHfa) / 2 },
  fpi: { label: 'ESPN FPI', hfa: RT.fpiHfa },
  sag: { label: 'Sagarin', hfa: RT.sagHfa },
};
function rateFrom(src, fpi, sagPts) { return src === 'fpi' ? fpi : src === 'sag' ? sagPts : (fpi + sagPts) / 2; }
let R, HFA, BASE, zPow, FCS_R, POW_M, POW_SD;
function setSource(src) {
  if (!SOURCES[src]) src = 'blend';
  S.src = src; HFA = SOURCES[src].hfa; R = {};
  FBS.forEach(i => R[i] = rateFrom(src, T[i].fpi, T[i].sag - SAG_MEAN));
  FCS_R = g => { const s = (g.fcsSag ?? FCS_SAG) - SAG_MEAN; return rateFrom(src, s * SAG_TO_FPI, s); };
  const order = [...FBS].sort((a, b) => R[b] - R[a]);
  BASE = R[order[11]]; // a typical playoff-caliber team
  const m = mean(FBS.map(i => R[i])), sd = sdev(FBS.map(i => R[i]));
  POW_M = m; POW_SD = sd;
  zPow = Object.fromEntries(FBS.map(i => [i, (R[i] - m) / sd]));
}
// Inside a simulated season, each team plays at a "true" strength drawn around its rating (SIMR), because the
// ratings are estimates. The game-to-game spread shrinks to match, so a single game's odds are unchanged, but
// a team that's stronger than its rating stays stronger all season, the way it does in real life.
const SIM_SD = 4.5, SD_TRUE = Math.sqrt(SD * SD - 2 * SIM_SD * SIM_SD);
// After each result, the rating the committee sees moves toward what happened: OBS_K points times the surprise.
const OBS_K = 3;
let SIMR = null;
const rOf = (id, g) => T[id] ? R[id] : FCS_R(g);
const loc = (g, id) => g.neutral ? 0 : (g.home === id ? HFA : -HFA);
const pWin = (a, b, edge = 0) => SIMR ? Phi((SIMR[a] - SIMR[b] + edge) / SD_TRUE) : Phi((R[a] - R[b] + edge) / SD);
const rTrue = (id, g) => SIMR && T[id] ? SIMR[id] : rOf(id, g);
const pHome = g => Phi((rTrue(g.home, g) - rTrue(g.away, g) + loc(g, g.home)) / (SIMR ? SD_TRUE : SD));
// The published (rating-based) chance, used to measure how surprising a result was
const pHomePub = g => Phi((rOf(g.home, g) - rOf(g.away, g) + loc(g, g.home)) / SD);
const spreadFor = (src, a, b, g) => {
  const r = id => T[id] ? rateFrom(src, T[id].fpi, T[id].sag - SAG_MEAN) : (s => rateFrom(src, s * SAG_TO_FPI, s))((g.fcsSag ?? FCS_SAG) - SAG_MEAN);
  return r(a) - r(b) + (g.neutral ? 0 : (g.home === a ? 1 : -1) * SOURCES[src].hfa);
};
setSource(S.src);

// ---------- season engine ----------
const pct = (w, l) => (w + l) ? w / (w + l) : 0;
function addResult(rec, g, homeWon, isConf) {
  for (const side of ['home', 'away']) {
    const id = g[side]; if (!rec[id]) continue;
    const won = side === 'home' ? homeWon : !homeWon, opp = side === 'home' ? g.away : g.home;
    const r = rec[id]; won ? r.w++ : r.l++;
    if (isConf) won ? r.cw++ : r.cl++;
    r.res.push({ opp, won, conf: isConf, loc: loc(g, id), oppR: rOf(opp, g) });
  }
}
function decide(a, b, edge, pickId, mode, rng) {
  if (pickId === a || pickId === b) return pickId;
  const p = pWin(a, b, edge);
  if (mode === 'sim') return rng() < p ? a : b;
  return p >= 0.5 ? a : b;
}
// ---------- conference tiebreakers ----------
// Each conference breaks ties with its own published procedure (CONF_TB). A step returns a value per tied team
// (higher is better). When a step separates a tied group, the teams it put on top and the rest each start over
// with the two-team or multi-team steps, whichever fits the smaller group. Conferences whose rules move a narrowed
// group of three or more on to the next step (cont) carry the top group on instead of restarting it.
const confPct = (rec, i) => pct(rec[i].cw, rec[i].cl);
const MEMBERS = {}; FBS.forEach(i => (MEMBERS[T[i].conf] ||= []).push(i));
function vsSet(rec, t, set) { let w = 0, l = 0; for (const r of rec[t].res) if (r.conf && set.has(r.opp)) r.won ? w++ : l++; return pct(w, l); }
function commonOpps(rec, grp) {
  const inGrp = new Set(grp);
  const sets = grp.map(t => new Set(rec[t].res.filter(r => r.conf && !inGrp.has(r.opp)).map(r => r.opp)));
  return [...sets[0]].filter(o => sets.every(s => s.has(o)));
}
const played = (rec, a, b) => rec[a].res.some(r => r.conf && r.opp === b);
const roundRobin = (rec, grp) => grp.every(a => grp.every(b => a === b || played(rec, a, b)));
const beat = (rec, a, b) => played(rec, a, b) && vsSet(rec, a, new Set([b])) === 1;
const zeros = grp => grp.map(() => 0);
const H2H = { name: 'Head-to-head', about: 'Result of the game between the two teams. If they didn\'t play, go to the next step.',
  fn: (rec, grp) => { const s = new Set(grp); return grp.map(t => vsSet(rec, t, s)); } };
const H2H_ALL = { ...H2H, about: 'Combined record in games among the tied teams.' };
// Multi-team head-to-head. always: combined record among the tied teams, played or not. Otherwise that needs a
// complete round robin; without one, a team that beat all the others goes ahead (sweep) and a team that lost to
// all the others drops out (loser).
function h2hGroup(o = {}) {
  if (o.always) return H2H_ALL;
  const about = 'If all the tied teams played each other, their combined record in those games. ' + (
    o.sweep && o.loser ? 'If not, a team that beat all the others goes ahead, and a team that lost to all the others drops out.'
    : o.sweep ? 'If not, a team that beat all the others goes ahead; otherwise go to the next step.'
    : 'If not, go to the next step.');
  return { name: 'Head-to-head', about, fn: (rec, grp) => {
    const s = new Set(grp);
    if (roundRobin(rec, grp)) return grp.map(t => vsSet(rec, t, s));
    return grp.map(t => {
      const others = grp.filter(x => x !== t);
      if (o.sweep && others.every(x => beat(rec, t, x))) return 1;
      if (o.loser && others.every(x => beat(rec, x, t))) return -1;
      return 0;
    });
  } };
}
const COMMON = { name: 'Common opponents', about: 'Record against the conference opponents that all the tied teams played.',
  fn: (rec, grp) => { const set = new Set(commonOpps(rec, grp)); return grp.map(t => vsSet(rec, t, set)); } };
// Record against the best-placed opponent, then down the standings, treating opponents tied in the standings as one
// group. Default: common opponents only. div: the rest of the division (Sun Belt). whole: any conference team, but a
// group some tied team didn't fully play is skipped (Mountain West).
function walkDown(o = {}) {
  const about = o.div ? 'Record against the next-highest team in the division standings, working down. Teams tied in the standings count as one group.'
    : o.whole ? 'Record against the next-highest team in the conference standings, working down. Teams tied in the standings count as one group, and a team or group that not every tied team played is skipped.'
    : 'Record against the best-placed common opponent, then the next one down the standings. Opponents tied in the standings count as one group' + (o.broken ? ' here; the MAC breaks those ties first.' : '.');
  return { name: o.div ? 'Next-highest division team' : o.whole ? 'Next-highest team' : 'Best common opponent', about, fn: (rec, grp) => {
    const inG = new Set(grp), c = T[grp[0]].conf;
    const pool = o.div ? MEMBERS[c].filter(x => T[x].div === T[grp[0]].div && !inG.has(x))
      : o.whole ? MEMBERS[c].filter(x => !inG.has(x)) : commonOpps(rec, grp);
    const order = pool.sort((a, b) => confPct(rec, b) - confPct(rec, a));
    for (let i = 0; i < order.length;) {
      let j = i; while (j < order.length && confPct(rec, order[j]) === confPct(rec, order[i])) j++;
      const tier = order.slice(i, j); i = j;
      if (o.whole && !grp.every(t => tier.every(x => played(rec, t, x)))) continue;
      const set = new Set(tier), v = grp.map(t => vsSet(rec, t, set));
      if (Math.max(...v) !== Math.min(...v)) return v;
    }
    return zeros(grp);
  } };
}
const SOS = { name: 'Strength of schedule', about: 'Combined conference winning percentage of each team\'s conference opponents.',
  fn: (rec, grp) => grp.map(t => { const os = rec[t].res.filter(r => r.conf); return os.length ? mean(os.map(r => confPct(rec, r.opp))) : 0; }) };
const DIV_PCT = { name: 'Division record', about: 'Winning percentage against division opponents.',
  fn: (rec, grp) => grp.map(t => { let w = 0, l = 0; for (const r of rec[t].res) if (r.conf && T[r.opp].div === T[t].div) r.won ? w++ : l++; return pct(w, l); }) };
const NONDIV_COMMON = { name: 'Common non-division opponents', about: 'Record against the conference opponents from the other division that all the tied teams played.',
  fn: (rec, grp) => { const set = new Set(commonOpps(rec, grp).filter(o => T[o].div !== T[grp[0]].div)); return grp.map(t => vsSet(rec, t, set)); } };
// Overall record. fcs1: at most one win over an FCS team counts. fbs: FBS games only. wins: count wins, not percentage.
function overall(name, about, o = {}) {
  return { name, about, fn: (rec, grp) => grp.map(t => {
    let w = 0, l = 0, fcsW = 0;
    for (const r of rec[t].res) {
      const fcs = !T[r.opp];
      if (fcs && o.fbs) continue;
      if (r.won) { if (fcs && o.fcs1 && fcsW++) continue; w++; } else l++;
    }
    return o.wins ? w : pct(w, l);
  }) };
}
// Metrics the app can't reproduce. The team rating chosen under "Win % from" stands in for each.
const STAND_IN = ' The app can\'t calculate this, so the team rating chosen under "Win % from" stands in.';
const approx = (name, about) => ({ name, about: about + STAND_IN, approx: true, fn: (rec, grp) => grp.map(t => R[t]) });
const SPORTSOURCE = approx('SportSource rating', 'Higher SportSource Analytics team Rating Score after the regular season.');
const SSR = approx('SportSource Team Success Ranking', 'Better SportSource Analytics Team Success Ranking after the regular season.');
const cfpOrComputers = list => approx('CFP ranking or computer composite', `A tied team ranked in the latest CFP rankings goes ahead if it wins its last regular-season game, the higher-ranked one if more than one does. Otherwise the best average of selected computer rankings (${list}) decides.`);
const last = name => ({ name, about: 'Last resort. It never comes up here because ratings always differ.', fn: zeros });
const OVERALL = overall('Overall record', 'Winning percentage in all games.');
const OVERALL_FCS1 = overall('Overall record', 'Winning percentage in all games, counting at most one win over an FCS team.', { fcs1: true });
const VS_FBS = overall('Record vs. FBS', 'Winning percentage in all games against FBS teams.', { fbs: true });
const AAC_MIX = 'Connelly SP+, SportSource TR116 SOR, ESPN SOR, KPI';
const SBC_MIX = 'Anderson & Hester, Massey, Colley, Wolfe';
const MW_MIX = 'Connelly SP+, ESPN SOR, KPI, SportSource';

// The order most FBS conferences share, for a conference whose own procedure isn't available
const GENERIC_TB = { generic: true, two: [H2H, COMMON, walkDown(), SOS, approx('Team rating', 'Higher team rating.'), last('Coin flip')] };
const CONF_TB = {
  8: { // SEC
    src: { label: 'SEC official football tiebreakers (PDF)', url: 'https://www.secsports.com/fbtiebreaker' },
    note: 'The procedure the SEC adopted in 2024, still the version it posts.',
    two: [H2H, COMMON, walkDown(), SOS,
      approx('Scoring margin', 'Capped relative scoring margin in conference games per SportSource Analytics: points scored and allowed compared with what each opponent usually allows and scores, with offense capped at 200%.'),
      last('Random draw')],
    multiH2h: h2hGroup({ sweep: true, loser: true }),
  },
  5: { // Big Ten
    src: { label: 'Big Ten tiebreaker procedure (PDF, archived copy)', url: 'https://web.archive.org/web/2025/https://bigten.org/api/media/file/85192401-602f-47ca-82c8-e7f8c97ef0d2-2024_Big_Ten_Football_Tiebreaker_-_FINAL_10__72_.pdf' },
    note: 'The procedure the Big Ten adopted in 2024. Its 2026 title-game page says tiebreakers apply but posts no newer version, and the original link is offline, so this links an archived copy.',
    cont: true,
    two: [H2H, COMMON, walkDown(), SOS, SPORTSOURCE, last('Random draw')],
    multiH2h: h2hGroup({ sweep: true }),
  },
  4: { // Big 12
    src: { label: 'Big 12 football championship tiebreaker policies', url: 'https://big12sports.com/sports/2024/9/6/FB_0906243427.aspx?path=football' },
    note: 'The procedure the Big 12 adopted in 2024, still the version it posts.',
    cont: true,
    two: [H2H, COMMON, walkDown(), SOS, overall('Total wins', 'Total wins in the 12-game season, counting at most one win over an FCS team.', { fcs1: true, wins: true }), SPORTSOURCE, last('Coin toss')],
    multiH2h: h2hGroup({ sweep: true }),
  },
  1: { // ACC
    src: { label: 'ACC football tiebreaker policy (PDF)', url: 'https://theacc.com/documents/2026/7/15//ACC_Football_Tiebreaker_Policy_Jully_2026.pdf' },
    note: 'Policy as amended July 1, 2026. Some teams play eight conference games and others nine, so a team that played a different number of games also counts as tied with the leaders when it has the same number of wins or the same number of losses. The ACC defines that for the top of the standings; the app applies it all the way down.',
    altGames: true,
    two: [H2H, SSR, last('Draw')],
    multiH2h: h2hGroup({ sweep: true, loser: true }),
  },
  151: { // American
    src: { label: 'American Conference football tiebreakers (PDF)', url: 'https://theamerican.org/documents/2025/10/29/25_FB_Tiebreakers.pdf' },
    note: 'From the American\'s 2025 football handbook, the latest version it has posted.',
    cont: true,
    two: [H2H, cfpOrComputers(AAC_MIX), COMMON, OVERALL, last('Coin toss')],
    multiH2h: h2hGroup({ sweep: true }),
  },
  15: { // MAC
    src: { label: 'MAC football championship tiebreaker', url: 'https://getsomemaction.com/sports/2025/11/12/FB_1112255434.aspx' },
    note: 'The procedure the MAC posted in 2025, the latest version on its site.',
    two: [H2H, COMMON, SPORTSOURCE, walkDown({ broken: true }), SOS, last('Draw')],
    multiH2h: h2hGroup({ sweep: true }),
  },
  17: { // Mountain West
    src: { label: 'Mountain West championship tiebreaking procedures (PDF)', url: 'https://storage.googleapis.com/themw-com/2025/10/c71edc0a-2025-mw-football-championship-tiebreakers-final.pdf' },
    note: 'The Mountain West procedure dated Aug. 22, 2024 and reposted for 2025, the latest version it has posted.',
    cont: true,
    two: [H2H, cfpOrComputers(MW_MIX), OVERALL_FCS1, walkDown({ whole: true }), COMMON, last('Coin toss')],
    multiH2h: h2hGroup({ sweep: true }),
  },
  9: { // Pac-12
    src: { label: 'Pac-12 2026 football announcement, tiebreaker section', url: 'https://pac-12.com/news/2026/9/3/pac-12-announces-commercial-and-operational-updates-ahead-of-its-2026-football-season-kickoff.aspx' },
    note: 'The tiebreakers the Pac-12 published for 2026. Week 13 flex games don\'t count in the standings.',
    cont: true,
    two: [H2H, walkDown(), COMMON, approx('CFP ranking', 'Higher CFP ranking on the Tuesday before week 13.'), SPORTSOURCE, last('Coin toss')],
    multi: [h2hGroup(), COMMON, walkDown(), SOS, SPORTSOURCE, last('Coin toss')],

let P; // deterministic projection from picks + favorites
function project() { P = runSeason('pick', null, S.w); }

const TABS = [['picks', 'Pick games'], ['standings', 'Standings'], ['matrix', 'Conference grid'], ['title', 'Title games'], ['rank', 'Rankings'], ['playoff', 'Playoff'], ['team', 'Team'], ['impact', 'Big games'], ['sim', 'Simulator'], ['odds', 'Odds']];
function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) =>
    `<button class="tab" role="tab" type="button" data-act="tab" data-v="${k}" aria-selected="${S.tab === k}">${l}</button>`).join('');
}
function renderTally() {
  const fin = GAMES.filter(g => g.final).length, left = GAMES.length - fin;
  const champ = P.bracket.F.win;
  document.getElementById('sub').textContent = `${D.season} FBS season · results through ${new Date(D.updated.replace(' UTC', 'Z').replace(' ', 'T')).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} · ${left} games left to call`;
  document.getElementById('tally').innerHTML =
    `<div><b>${fin}</b><span>Final</span></div><div><b>${Object.keys(S.picks).length}</b><span>Your picks</span></div>` +
    `<div><b>${esc(T[champ].abbr)}</b><span>Your champ</span></div>`;
  const n = Object.keys(S.picks).length;
  document.getElementById('pickcount').textContent = n ? `Unpicked games go to the favorite.` : `Every unplayed game is set to the favorite. Tap a team to pick an upset.`;
}

// "Playoff 92% with win · 61% with loss" under a team, from the simulations
function impactLine(g, id, side) {
  if (!T[id] || !oddsReady()) return '';
  const j = ODDS.openIdx[g.id]; if (j === undefined) return '';
  const c = condOdds(id, j, 'cfp'); if (!c.ok) return '';
  const win = side === 'home' ? c.home : c.away, loss = side === 'home' ? c.away : c.home;
  if (Math.max(win, loss) < 0.005) return '';
  return `<span class="imp">Playoff <b>${fmtPct(win)}</b> with win · <b>${fmtPct(loss)}</b> with loss</span>`;
}
function sideBtn(g, side) {
  const id = g[side], other = g[side === 'home' ? 'away' : 'home'];
  const p = side === 'home' ? pHome(g) : 1 - pHome(g);
  const fcs = !T[id];
  const pr = !fcs && pollRank(id, g.week);
  const r = !fcs && P.rec[id], rank = pr ? `<span class="rk" title="${esc(pollForWeek(g.week).label)} rank">${pr}</span> ` : '';
  const name = fcs ? esc(g.fcsName || 'FCS opponent') : esc(T[id].name);
  let cls = 'side', right;
  if (g.final) {
    const won = (side === 'home' ? g.hs > g.as : g.as > g.hs);
    cls += won ? ' won' : ' lost';
    right = `<span class="v">${side === 'home' ? g.hs : g.as}</span>`;
  } else {
    const pick = S.picks[g.id];
    if (pick === side) cls += S.sim[g.id] ? ' picked sim' : ' picked'; else if (!pick && p >= 0.5) cls += ' proj';
    right = `<span class="p">${fmtPct(p)}</span>`;
    right += impactLine(g, id, side);
  }
  const tip = g.final ? '' : ' title="' + ['fpi', 'sag', 'blend'].map(s => `${SOURCES[s].label}: ${fmtPct(Phi(spreadFor(s, id, other, g) / SD))}`).join(' · ') + '"';
  return `<button class="${cls}" type="button"${tip} ${g.final || fcs ? 'disabled' : `data-act="pick" data-g="${g.id}" data-s="${side}"`}>
    ${chip(id, g.fcsName)}<span class="nm">${rank}${name}${r ? `<small>${recStr(r)}</small>` : ''}</span>${right}</button>`;
}

function gameCard(g, showWeek) {
  const d = new Date(g.date);
  const when = g.final ? 'Final' : g.live ? (g.ls ? `Live · ${g.ls[1] ?? 0}–${g.ls[0] ?? 0}` : 'Live') : d.toLocaleDateString(undefined, { weekday: 'short', month: 'numeric', day: 'numeric' }) + ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  const extra = [];
  if (showWeek) extra.push('Wk ' + g.week);
  if (g.conf && T[g.home] && T[g.away] && T[g.home].conf === T[g.away].conf && T[g.home].conf !== IND) extra.push(esc(CONF[T[g.home].conf].abbr.toUpperCase()));
  if (g.neutral) extra.push('Neutral');
  return `<div class="game"><div class="gmeta"><span>${when}</span>${extra.map(e => `<span class="tag">${e}</span>`).join('')}</div>
    ${sideBtn(g, 'away')}${sideBtn(g, 'home')}</div>`;
}
const teamCell = id => `<button class="tmb" type="button" data-act="team" data-v="${id}" title="See ${esc(T[id].name)}'s schedule"><div class="tm">${chip(id)}<span class="nm">${esc(T[id].name)}</span></div></button>`;
const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');

function renderSheet() {
  const id = S.team, t = T[id], r = P.rec[id];
  const cf = CONF[t.conf], isInd = t.conf === IND;
  let place = '', ccgCard = '';
  if (!isInd) {
    const gr = P.st[t.conf].find(g => g.ids.includes(id));
    place = `${ordinal(gr.ids.indexOf(id) + 1)} in the ${esc(gr.div ? cf.abbr.toUpperCase() + ' ' + gr.div : cf.name.replace(' Conference', ''))}`;
    const m = P.ccg[t.conf];
    if (m.a === id || m.b === id) {
      const pa = pWin(m.a, m.b, 0);
      const btn = (x, p) => { const picked = S.ccg[t.conf] === x, proj = !S.ccg[t.conf] && m.win === x;
        return `<button class="side${picked ? ' picked' : proj ? ' proj' : ''}" type="button" data-act="ccg" data-c="${t.conf}" data-v="${x}">${chip(x)}<span class="nm">${esc(T[x].name)}<small>${recStr(P.rec[x])}</small></span><span class="p">${fmtPct(p)}</span></button>`; };
      ccgCard = `<div class="game"><div class="gmeta"><span>Conference title game</span><span class="tag">Neutral</span></div>${btn(m.a, pa)}${btn(m.b, 1 - pa)}</div>`;
    }
  }
  const seed = P.seeds.indexOf(id);
  const status = seed >= 0 ? `Seed ${seed + 1}${P.auto.has(id) ? ' (auto bid)' : ''}${seed < 4 ? ', first-round bye' : ''}` : 'Out';
  const odds = ODDS && ODDS.done ? `<div><span>Playoff odds </span><b>${fmtPct(ODDS.cnt[id].cfp / ODDS.done)}</b></div>` : '';
  const games = GAMES.filter(g => g.home === id || g.away === id).map(g => gameCard(g, true)).join('');
  return `<div class="sheet-head">${chip(id)}<div><div class="t">${esc(t.name)} ${esc(t.mascot)}</div>
      <div class="k">${esc(isInd ? 'Independent' : cf.name.replace(' Conference', ''))} · ${esc(SOURCES[S.src].label)} ${sgn(R[id])}</div></div>
      <button class="x" type="button" data-act="close-sheet">Close</button></div>
    <div class="sheet-body">
      <div class="facts"><div><span>Projected </span><b>${recStr(r)}</b></div>${isInd ? '' : `<div><span>Conf </span><b>${r.cw}-${r.cl}</b></div><div><b>${place}</b></div>`}
        <div><span>Rank </span><b>#${P.rk[id]}</b></div><div><span>Playoff </span><b>${status}</b></div>${odds}</div>
      <p class="hint" style="margin:0">Tap a team to pick it. Every tab updates as you go.</p>
      <div class="games">${games}${ccgCard}</div>
      ${sheetImpact(id)}
    </div>`;
}
function sheetImpact(id) {
  if (!oddsReady()) return '';
  const now = ODDS.cnt[id].cfp / ODDS.done, rows = impactRows(id, 'cfp', 8, now);
  if (!rows) return '';
  return `<h2 style="margin-top:8px">Games that move its playoff chances</h2>
    <div class="imp-list">${rows}</div>
    <div class="btns"><button class="btn" type="button" data-act="team-open" data-v="${id}">Open the team page</button><button class="btn" type="button" data-act="imp-open" data-v="${id}">See the top 25, and bye chances</button></div>`;
}
function openSheet(id) {
  S.team = id; const dlg = document.getElementById('sheet');
  dlg.innerHTML = renderSheet();
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
  const next = dlg.querySelector('.game [data-act="pick"], .game [data-act="ccg"]');
  if (next) dlg.scrollTop = next.closest('.game').offsetTop - dlg.querySelector('.sheet-head').offsetHeight - 70;
}

// The real poll for a week: the latest CFP ranking (once released), else the latest AP poll, dated on or before
// that week's first game. Weeks older than every saved poll use the earliest one, flagged as `early`.
const POLL_WEEK = {};
function pollForWeek(week) {
  if (POLL_WEEK[week] !== undefined) return POLL_WEEK[week];
  const start = GAMES.filter(g => g.week === week).map(g => etDate(g.date)).sort()[0];
  const pick = kind => {
    const arch = pollArchive(kind), dates = Object.keys(arch).sort();
    if (!dates.length) return null;
    const before = dates.filter(d => d <= start);
    const d = before.length ? before[before.length - 1] : dates[0];
    return { kind, date: d, early: !before.length, label: kind === 'cfp' ? 'CFP' : 'AP', ...arch[d] };
  };
  const cfp = pick('cfp');
  return POLL_WEEK[week] = (cfp && !cfp.early ? cfp : null) || pick('ap');
}
const pollRank = (id, week) => { const pw = pollForWeek(week); return pw && T[id] ? pw.ranks[id] || null : null; };
const rankedGame = g => !!(pollRank(g.home, g.week) || pollRank(g.away, g.week));
function renderPicks() {
  const weeks = [...new Set(GAMES.map(g => g.week))].sort((a, b) => a - b);
  if (S.week == null || !weeks.includes(S.week)) S.week = (GAMES.find(g => !g.final) || GAMES[GAMES.length - 1]).week;
  const q = S.q.trim().toLowerCase();
  const match = id => T[id] && ((!S.conf || T[id].conf === S.conf) && (!q || (T[id].name + ' ' + T[id].abbr + ' ' + T[id].mascot).toLowerCase().includes(q)));
  const list = GAMES.filter(g => (q ? true : g.week === S.week) && (match(g.home) || match(g.away)) && (!S.top25 || rankedGame(g)));
  const pw = pollForWeek(S.week);
  const pollName = pw ? (pw.name || '').split(' - ').pop() || pw.label + ' poll' : '';
  const pollNote = !pw ? 'No poll saved yet.' : `Ranks are from the ${esc(pollName)}${pw.early ? ', the earliest poll saved, so they may not match that week' : ''}.`;
  const wkBtns = weeks.map(w => {
    const done = GAMES.filter(g => g.week === w).every(g => g.final);
    return `<button class="wk${done ? ' done' : ''}" type="button" data-act="week" data-v="${w}" aria-pressed="${!q && S.week === w}">${w}</button>`;
  }).join('');
  const opts = `<option value="">All conferences</option>` + D.conferences.map(c => `<option value="${c.id}"${S.conf === c.id ? ' selected' : ''}>${esc(c.abbr === 'ind' ? 'Independents' : c.name.replace(' Conference', ''))}</option>`).join('');
  const rows = list.map(g => gameCard(g, !!q)).join('');
  return `<h2>${q ? `Games matching “${esc(S.q)}”` : `Week ${S.week}`}</h2>
    <p class="lede">Tap a team to pick it. The small number before a team is its real poll rank. Win chances come from ${SOURCES[S.src].label === 'FPI + Sagarin blend' ? 'an average of ESPN FPI and Sagarin' : SOURCES[S.src].label}, including home field. Hover a percentage to see each source. Records and rankings next to each team update as you pick.</p>
    <div class="filters"><div class="weeks" role="group" aria-label="Week">${wkBtns}</div>
      <div class="seg" role="group" aria-label="Which games"><button type="button" data-act="top25" data-v="0" aria-pressed="${!S.top25}">All games</button><button type="button" data-act="top25" data-v="1" aria-pressed="${!!S.top25}">Top 25 games</button></div>
      <select id="f-conf" aria-label="Conference">${opts}</select>
      <input id="f-q" type="search" placeholder="Find a team's schedule" value="${esc(S.q)}" aria-label="Team search"></div>
    <p class="hint" style="margin:-4px 0 10px">${S.top25 ? `Showing ${list.length} game${list.length === 1 ? '' : 's'} with a ranked team. ` : ''}${pollNote}</p>
    <div class="legend"><span><i></i>Projected winner (favorite)</span><span><i class="pk"></i>Your pick</span><span><i class="pk sm"></i>Simulated result</span></div>
    <div class="games">${rows || '<p class="hint">No games match those filters.</p>'}</div>`;
}

const playoffPct = id => ODDS && ODDS.done >= 500 ? fmtPct(ODDS.cnt[id].cfp / ODDS.done) : '…';
function standTable(ids, slots) {
  return `<div class="scroll"><table><thead><tr><th>Team</th><th class="n">Conf</th><th class="n">All</th><th class="n hide-sm">Power</th><th class="n" title="Playoff chance from the simulations">CFP%</th><th class="n">Rk</th></tr></thead><tbody>` +
    ids.map((id, i) => {
      const r = P.rec[id];
      return `<tr class="${i < slots ? 'ccg' : ''}"><td>${teamCell(id)}</td>
        <td class="n">${r.cw}-${r.cl}</td><td class="n">${r.w}-${r.l}</td><td class="n hide-sm">${sgn(R[id])}</td><td class="n">${playoffPct(id)}</td><td class="n">${P.rk[id] <= 25 ? P.rk[id] : ''}</td></tr>`;
    }).join('') + `</tbody></table></div>`;
}
function tieNotes(ties) {
  if (!ties || !ties.length) return '';
  const abbrs = ids => ids.map(i => esc(T[i].abbr)).join(', ');
  return `<ul class="ties">` + ties.map(t => {
    const recs = [...new Set(t.teams.map(i => `${P.rec[i].cw}-${P.rec[i].cl}`))];
    const at = recs.length === 1 ? `tied at ${recs[0]}` : `tied (${recs.join(', ')}, which counts as a tie because they played different numbers of conference games)`;
    return `<li><b>${abbrs(t.teams)}</b> ${at}. ${esc(t.step)}${t.approx ? ' (team rating standing in)' : ''} puts ${abbrs(t.top)} ahead.</li>`;
  }).join('') + `</ul>`;
}
function tbRules(cid) {
  const tb = TB(cid);
  const list = steps => `<ol>${steps.map(s => `<li><b>${esc(s.name)}${s.approx ? ' ≈' : ''}.</b> ${esc(s.about)}</li>`).join('')}</ol>`;
  const flow = tb.cont ? ' When a step narrows a group of three or more, the teams still tied move on to the next step; once two are left, they start over with the two-team steps.'
    : ' When a step separates some of the tied teams, each smaller group starts over at step 1.';
  const src = tb.src ? ` Source: <a href="${esc(tb.src.url)}" target="_blank" rel="noopener">${esc(tb.src.label)}</a>.` : '';
  return `<details class="tb" data-c="${cid}"${S.tbOpen && S.tbOpen[cid] ? ' open' : ''}><summary>Tiebreakers${tb.generic ? ' (generic order)' : ''}</summary>
    <h5>Two teams</h5>${list(tb.two)}<h5>Three or more teams</h5>${list(tb.multi)}${tb.host ? `<h5>Title game host</h5>${list(tb.host)}` : ''}
    <p class="hint">${esc(tb.note)}${flow}${src}</p></details>`;
}
function renderStandings() {
  const cards = D.conferences.filter(c => c.id !== IND).map(c => {
    const groups = P.st[c.id], cg = P.ccg[c.id];
    const body = groups.length > 1 ? groups.map(gr => `<h4>${esc(gr.div)}</h4>` + standTable(gr.ids, 1) + tieNotes(gr.ties)).join('') : standTable(groups[0].ids, 2) + tieNotes(groups[0].ties);
    return `<section class="card"><h3>${esc(c.name.replace(' Conference', ''))}<span class="pill">${esc(T[cg.a].abbr)} vs ${esc(T[cg.b].abbr)}</span></h3>${body}${tbRules(c.id)}</section>`;
  }).join('');
  const ind = FBS.filter(i => T[i].conf === IND);
  const indCard = ind.length ? `<section class="card"><h3>Independents</h3>${standTable(ind.sort((a, b) => P.rk[a] - P.rk[b]), 0)}</section>` : '';
  return `<h2>Projected final standings</h2>
    <p class="lede">Final records using real results, your picks, and favorites for everything else. The orange edge marks who plays in the title game. Tap a team to see and change its schedule.</p>
    <details class="rules" id="rules"${S.rulesOpen ? ' open' : ''}><summary>How ties are broken</summary>
      <p>Teams with the same conference record go through their own conference's tiebreaker steps. Open <b>Tiebreakers</b> on any card below to see that conference's steps, with a link to its official rules. Most conferences use different steps for two tied teams than for three or more, and the Sun Belt breaks ties within each division.</p>
      <p>Steps marked ≈ use something the app can't calculate, such as a CFP ranking, a SportSource Analytics rating or a composite of computer rankings. The team rating chosen under "Win % from" stands in for those. Because ratings always differ, coin tosses and draws never come up.</p>
      <p class="hint">Conference USA doesn't post its current procedure on its website, so its card uses the generic order most conferences share: head-to-head, common opponents, best common opponent, strength of schedule, then team rating.</p>
    </details>
    <div class="cards">${cards}${indCard}</div>`;
}

// Conference grid: one row and one column per team, ordered by projected standings. Reading across a row gives
// that team's result against each column team. Tapping an open cell makes the row team win; tapping again
// goes back to the projection.
const CONF_SHORT = { American: 'AAC', acc: 'ACC', big12: 'Big 12', big10: 'Big Ten', usa: 'C-USA', midam: 'MAC', mwest: 'Mountain West', pac12: 'Pac-12', sec: 'SEC', belt: 'Sun Belt' };
const pairKey = (a, b) => a < b ? a + '|' + b : b + '|' + a;
function confGames(cid) {
  const pair = {};
  for (const g of GAMES) if (T[g.home] && T[g.away] && T[g.home].conf === cid && T[g.away].conf === cid) (pair[pairKey(g.home, g.away)] ||= []).push(g);
  return pair;
}
function mxCell(r, col, pair) {
  if (r === col) return `<td class="c mx-self" aria-hidden="true"></td>`;
  const games = pair[pairKey(r, col)];
  if (!games) return `<td class="c mx-none" title="${esc(T[r].name)} and ${esc(T[col].name)} don't play"></td>`;
  const g = games[0], rowHome = g.home === r, side = rowHome ? 'home' : 'away';
  const where = g.neutral ? 'vs ' : rowHome ? '' : '@ ';
  const vs = `${esc(T[r].name)} ${rowHome || g.neutral ? 'vs.' : 'at'} ${esc(T[col].name)}, week ${g.week}`;
  if (g.final) {
    const won = rowHome ? g.hs > g.as : g.as > g.hs, score = rowHome ? `${g.hs}-${g.as}` : `${g.as}-${g.hs}`;
    return `<td class="c fin ${won ? 'w' : 'l'}" title="${vs}: final ${score}"><b>${won ? 'W' : 'L'}</b><small>${score}</small></td>`;
  }
  const p = rowHome ? pHome(g) : 1 - pHome(g), pick = S.picks[g.id];
  const st = pick ? (pick === side ? 'pw' : 'pl') : (p >= 0.5 ? 'fw' : 'fl');
  const letter = st === 'pw' || st === 'fw' ? 'W' : 'L';
  const how = pick ? (S.sim[g.id] ? 'simulated' : 'your pick') : 'projected';
  return `<td class="c"><button class="mx-btn ${st}${pick && S.sim[g.id] ? ' sim' : ''}" type="button" data-act="mx" data-g="${g.id}" data-s="${side}"
    title="${vs}. ${esc(T[r].name)} win chance ${fmtPct(p)}. Now: ${letter === 'W' ? 'win' : 'loss'} (${how}). Tap to ${pick === side ? 'go back to the projection' : 'make ' + esc(T[r].name) + ' win'}.">
    <b>${letter}</b><small>${where}${fmtPct(p)}</small></button></td>`;
}
function renderMatrix() {
  const confs = D.conferences.filter(c => c.id !== IND);
  if (!confs.some(c => c.id === S.mxConf)) S.mxConf = '8';
  const c = CONF[S.mxConf], groups = P.st[c.id], pair = confGames(c.id);
  const ids = groups.flatMap(gr => gr.ids);
  const ccgIds = new Set([P.ccg[c.id].a, P.ccg[c.id].b]);
  const divStart = new Set(groups.slice(1).map(gr => gr.ids[0]));
  const confBtns = confs.map(x => `<button type="button" data-act="mx-conf" data-v="${x.id}" aria-pressed="${x.id === c.id}">${esc(CONF_SHORT[x.abbr] || x.abbr)}</button>`).join('');
  const head = `<tr><th></th>${ids.map(id => `<th title="${esc(T[id].name)}">${chip(id)}</th>`).join('')}<th class="n">Conf</th><th class="n">CFP%</th></tr>`;
  const body = ids.map(r => {
    const rec = P.rec[r];
    return `<tr class="${divStart.has(r) ? 'div-start' : ''}"><th class="rowh${ccgIds.has(r) ? ' ccg' : ''}">${teamCell(r)}</th>${ids.map(col => mxCell(r, col, pair)).join('')}
      <td class="n tot">${rec.cw}-${rec.cl}</td><td class="n tot">${playoffPct(r)}</td></tr>`;
  }).join('');
  const m = P.ccg[c.id], pa = pWin(m.a, m.b, 0);
  const tgBtn = (id, p) => {
    const picked = S.ccg[c.id] === id, proj = !S.ccg[c.id] && m.win === id;
    return `<button class="side${picked ? ' picked' : proj ? ' proj' : ''}" type="button" data-act="ccg" data-c="${c.id}" data-v="${id}">${chip(id)}<span class="nm">${esc(T[id].name)}<small>${recStr(P.rec[id])}</small></span><span class="p">${fmtPct(p)}</span></button>`;
  };
  const champ = P.champs[c.id], seed = P.seeds.indexOf(champ);
  const nPicked = Object.values(pair).flat().filter(g => S.picks[g.id]).length + (S.ccg[c.id] ? 1 : 0);
  const standings = groups.length > 1
    ? groups.map(gr => `<h4>${esc(gr.div)}</h4>` + standTable(gr.ids, 1) + tieNotes(gr.ties)).join('')
    : standTable(groups[0].ids, 2) + tieNotes(groups[0].ties);
  const short = CONF_SHORT[c.abbr] || c.name.replace(' Conference', '');
  return `<h2>${esc(short)} grid</h2>
    <p class="lede">Read across a row for that team's result against each team at the top. Tap an open game to make the row team win, and tap it again to go back to the projection. The standings, title game and playoff picture next to the grid update as you go.</p>
    <div class="filters"><div class="seg mx-confs" role="group" aria-label="Conference">${confBtns}</div>
      <button class="btn" type="button" data-act="mx-clear"${nPicked ? '' : ' disabled'}>Clear ${esc(short)} picks</button></div>
    <div class="legend"><span><i class="lg fw"></i>Projected win</span><span><i class="lg pw"></i>Your pick: win</span><span><i class="lg pl"></i>Your pick: loss</span><span><i class="lg fin-w"></i>Final</span><span>@ away · vs neutral · % is the row team's win chance</span></div>
    <div class="mx-wrap">
      <div class="scroll mx-scroll"><table class="mx"><thead>${head}</thead><tbody>${body}</tbody></table></div>
      <aside class="card mx-side">

    <td class="n">${(b.exp / b.flips * 100).toFixed(1)}%</td><td class="n"><b>${(b.won / b.flips * 100).toFixed(1)}%</b></td></tr>`).join('');
  return `<h2>Check the dice</h2>
    <p class="lede">Proof the coin is fair. Every unplayed game was replayed ${DICE_FLIPS.toLocaleString()} times with the same coin flip the simulator uses, then grouped by how big a favorite the favorite was. The favorite's actual win rate should match its expected rate in every row.</p>
    <div class="scroll"><table class="dice"><thead><tr><th>Favorite's chance</th><th class="n">Games</th><th class="n">Flips</th><th class="n">Expected</th><th class="n">Actual</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

const espnPct = (id, k) => T[id].espn && T[id].espn[k] != null ? fmtPct(T[id].espn[k] / 100) : '';
function renderOdds() {
  if (!ODDS) return '<p class="hint">Starting simulations…</p>';
  const { cnt, done, N } = ODDS, n = Math.max(done, 1);
  const ids = FBS.filter(i => (!S.conf || T[i].conf === S.conf)).sort((a, b) => cnt[b].cfp - cnt[a].cfp || cnt[b].conf - cnt[a].conf || R[b] - R[a])
    .filter((id, i) => S.conf || i < 40);
  const bar = (v, o) => `<div class="bar${o ? ' o' : ''}" title="${(v * 100).toFixed(1)}%"><b style="width:${(v * 100).toFixed(1)}%"></b></div>`;
  const opts = `<option value="">Top 40 overall</option>` + D.conferences.map(c => `<option value="${c.id}"${S.conf === c.id ? ' selected' : ''}>${esc(c.abbr === 'ind' ? 'Independents' : c.name.replace(' Conference', ''))}</option>`).join('');
  const rows = ids.map(id => {
    const c = cnt[id];
    return `<tr><td>${teamCell(id)}</td><td class="n">${(c.w / n).toFixed(1)}</td>
      <td class="n hide-sm">${T[id].conf === IND ? '' : fmtPct(c.ccg / n)}</td><td class="n">${T[id].conf === IND ? '' : fmtPct(c.conf / n)}</td>
      <td class="n">${fmtPct(c.cfp / n)}</td><td class="n espn">${espnPct(id, 'probmakeplayoffs')}</td><td style="width:20%">${bar(c.cfp / n)}</td><td class="n hide-sm">${fmtPct(c.bye / n)}</td><td class="n">${fmtPct(c.title / n)}</td><td class="n espn hide-sm">${espnPct(id, 'probwintitle')}</td></tr>`;
  }).join('');
  return `<h2>Playoff odds</h2>
    <p class="lede">${N.toLocaleString()} simulated seasons. Your picks are locked in and every other game is a weighted coin flip using ${esc(SOURCES[S.src].label)} odds, title games and playoff included. The gray ESPN columns are ESPN's own FPI simulations for comparison. They don't include your picks.</p>
    <div class="filters"><select id="f-conf" aria-label="Conference">${opts}</select>
      <button class="btn" type="button" data-act="rerun">Run again</button>
      <span class="hint">${ODDS.running ? `Simulating… ${done.toLocaleString()} of ${N.toLocaleString()}` : ODDS.stale ? 'Updating for your new picks…' : `Done · ${done.toLocaleString()} seasons`}</span></div>
    <div class="progress"><b style="width:${(done / N * 100).toFixed(0)}%"></b></div>
    <div class="scroll"><table><thead><tr><th>Team</th><th class="n">Avg W</th><th class="n hide-sm">Title game</th><th class="n">Conf champ</th><th class="n">Playoff</th><th class="n espn">ESPN</th><th></th><th class="n hide-sm">Bye</th><th class="n">Natl champ</th><th class="n espn hide-sm">ESPN</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

const NOTE = `<p class="note">Schedule, scores and FPI from ESPN; PREDICTOR ratings from <a href="http://sagarin.com/sports/cfsend.htm" target="_blank" rel="noopener">Jeff Sagarin</a> (through ${esc(RT.sagThrough)}). Last pulled ${esc(D.updated)}. Home field is worth ${RT.sagHfa} points for Sagarin, his own figure, and ${RT.fpiHfa} for FPI, an estimate because ESPN doesn't publish one. Win chance assumes a ${SD}-point standard deviation around the spread. The committee rankings are this page's own model, not the real CFP rankings.</p>`;
function render() {
  renderTabs(); renderTally();
  document.getElementById('f-src').value = S.src;
  const dlg = document.getElementById('sheet');
  if (dlg.open && T[S.team]) { const y = dlg.scrollTop; dlg.innerHTML = renderSheet(); dlg.scrollTop = y; }
  const f = { picks: renderPicks, standings: renderStandings, matrix: renderMatrix, title: renderTitle, rank: renderRank, playoff: renderPlayoff, team: renderTeam, impact: renderImpact, sim: renderSim, odds: renderOdds }[S.tab] || renderPicks;
  const main = document.getElementById('main');
  const focusId = document.activeElement && document.activeElement.id, selStart = document.activeElement && document.activeElement.selectionStart;
  main.innerHTML = f() + NOTE;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (el.type === 'search' && selStart != null) el.setSelectionRange(selStart, selStart); } }
}
function changed() { project(); save(); render(); scheduleOdds(); }

// ---------- events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'team') { openSheet(b.dataset.v); return; }
  if (a === 'close-sheet') { document.getElementById('sheet').close(); return; }
  if (a === 'mx') { const g = b.dataset.g, sd = b.dataset.s; delete S.sim[g]; S.picks[g] === sd ? delete S.picks[g] : S.picks[g] = sd; return changed(); }
  if (a === 'mx-conf') { S.mxConf = b.dataset.v; save(); render(); return; }
  if (a === 'mx-clear') { const c = S.mxConf; Object.values(confGames(c)).flat().forEach(g => { delete S.picks[g.id]; delete S.sim[g.id]; }); delete S.ccg[c]; delete S.simCcg[c]; return changed(); }
  if (a === 'winout') { const id = b.dataset.v; for (const g of openOwn(id)) { S.picks[g.id] = g.home === id ? 'home' : 'away'; delete S.sim[g.id]; } return changed(); }
  if (a === 'team-clear') { const id = b.dataset.v; for (const g of GAMES) if (!g.final && (g.home === id || g.away === id)) { delete S.picks[g.id]; delete S.sim[g.id]; } return changed(); }
  if (a === 'chaos') { S.chaos = +b.dataset.v; save(); render(); return; }
  if (a === 'top25') { S.top25 = b.dataset.v === '1'; save(); render(); return; }
  if (a === 'asof') { S.asOf = b.dataset.v; save(); render(); return; }
  if (a === 'fit-w') { S.w = +b.dataset.v; return changed(); }
  if (a === 'imp-metric') { S.impMetric = b.dataset.v; save(); render(); return; }
  if (a === 'imp-n') { S.impN = +b.dataset.v; save(); render(); return; }
  if (a === 'team-open') { S.impTeam = b.dataset.v; S.tab = 'team'; document.getElementById('sheet').close(); save(); render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'imp-open') { S.impTeam = b.dataset.v; S.tab = 'impact'; document.getElementById('sheet').close(); save(); render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'tab') { S.tab = b.dataset.v; save(); render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'week') { S.week = +b.dataset.v; S.q = ''; save(); render(); return; }
  if (a === 'pick') { const g = b.dataset.g, s = b.dataset.s; delete S.sim[g]; S.picks[g] === s ? delete S.picks[g] : S.picks[g] = s; return changed(); }
  if (a === 'ccg') { const c = b.dataset.c, v = b.dataset.v; delete S.simCcg[c]; S.ccg[c] === v ? delete S.ccg[c] : S.ccg[c] = v; return changed(); }
  if (a === 'cfp') { const g = b.dataset.g, v = b.dataset.v; delete S.simCfp[g]; S.cfp[g] === v ? delete S.cfp[g] : S.cfp[g] = v; return changed(); }
  if (a === 'clear') { S.picks = {}; S.ccg = {}; S.cfp = {}; S.sim = {}; S.simCcg = {}; S.simCfp = {}; S.lastSim = null; return changed(); }
  if (a === 'rerun') { runOdds(); render(); return; }
  if (a === 'random' || a === 'sim-rest') { simRest('Rest of the season'); return changed(); }
  if (a === 'sim-week') { simWeek(); return changed(); }
  if (a === 'sim-reroll') { clearSim(); simRest('Re-rolled season'); return changed(); }
  if (a === 'sim-clear') { clearSim(); return changed(); }
  if (a === 'sim-open') { S.tab = 'sim'; save(); render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'dice') { S.diceOpen = !S.diceOpen; save(); render(); return; }
});
const sheetEl = document.getElementById('sheet');
sheetEl.addEventListener('click', e => { if (e.target === sheetEl) sheetEl.close(); }); // backdrop
sheetEl.addEventListener('close', () => { S.team = null; });
document.addEventListener('toggle', e => {
  if (e.target.id === 'rules') { S.rulesOpen = e.target.open; save(); }
  if (e.target.classList && e.target.classList.contains('tb')) { S.tbOpen = { ...S.tbOpen, [e.target.dataset.c]: e.target.open }; save(); }
}, true);
document.addEventListener('change', e => {
  if (e.target.id === 'f-conf') { S.conf = e.target.value; save(); render(); }
  if (e.target.id === 'f-team') { S.impTeam = e.target.value; save(); render(); }
  if (e.target.id === 'f-chaos') { S.chaos = +e.target.value; save(); render(); }
  if (e.target.id === 'f-imp-team') { S.impTeam = e.target.value; save(); render(); }
  if (e.target.id === 'f-src') { setSource(e.target.value); changed(); }
  if (e.target.id === 'f-h2h') { S.h2h = e.target.checked; changed(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'f-q') { S.q = e.target.value; save(); render(); }
  if (e.target.id === 'f-w') { S.w = +e.target.value; project(); save(); render(); scheduleOdds(); }
});

project(); render(); runOdds();
</script>
</body>
</html>
