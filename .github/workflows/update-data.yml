name: Update scores

on:
  schedule:
    - cron: "0 9 * * *"          # daily, 9:00 UTC
    # Game days: every 30 minutes from 11 a.m. to 3 a.m. Eastern (Saturday 15:00 UTC to Sunday 07:00 UTC)
    - cron: "*/30 15-23 * * 6"
    - cron: "*/30 0-7 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_data.py
      - name: Snapshot today's playoff odds
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          python scripts/snapshot_odds.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/season.js data/history.js
          git diff --cached --quiet || git commit -m "Update scores"
          git push
